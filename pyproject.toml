[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "damon-agent"
version = "0.1.0"
description = "Damon Agent — Agente de IA pessoal, autônomo e adaptativo"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Elisabete Alves", email = "elisabete@eapeli.dev"}]
maintainers = [{name = "Elisabete Alves", email = "elisabete@eapeli.dev"}]
keywords = ["ai", "agent", "cli", "automation", "llm", "tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "rich>=13.7",
    "prompt-toolkit>=3.0",
    "httpx>=0.26",
    "tenacity>=8.2",
    "sqlite-utils>=3.37",
    "python-dotenv>=1.0",
    "click>=8.1",
    "uvicorn>=0.27",
    "fastapi>=0.109",
    "websockets>=12.0",
    "aiofiles>=23.1",
    "python-dateutil>=2.8",
    "croniter>=2.0",
    "gitpython>=3.1",
    "docker>=7.0",
    "paramiko>=3.4",
]

[project.optional-dependencies]
all = [
    "browser-use>=0.1",
    "playwright>=1.40",
    "firecrawl>=0.1",
    "fal-client>=0.2",
    "openai>=1.10",
    "anthropic>=0.20",
    "google-generativeai>=0.5",
    "elevenlabs>=0.3",
    "coqui-tts>=0.17",
    "huggingface-hub>=0.20",
    "modal>=0.64",
    "daytona-sdk>=0.2",
    "mcp>=0.1",
    "honcho>=0.1",
    "mem0ai>=0.1",
    "supermemory>=0.1",
    "wandb>=0.17",
]
dev = [
    "pytest>=7.4",
    "pytest-xdist>=3.5",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.8",
    "pre-commit>=3.6",
    "types-requests>=2.31",
]
docs = [
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
    "mkdocs-mermaid2-plugin>=1.1",
]

[project.scripts]
damon = "damon_cli.main:main"
damon-acp = "acp_adapter.entry:main"
damon-ui = "damon_ui:run"

[project.urls]
Homepage = "https://github.com/eapeli/damon"
Repository = "https://github.com/eapeli/damon"
Issues = "https://github.com/eapeli/damon/issues"
Documentation = "https://github.com/eapeli/damon/wiki"
Discord = "https://discord.gg/damon"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "damon_pkg*", "damon_cli*", "gateway*", "tools*", "cron*", "scripts*", "acp_adapter*", "acp_registry*", "damon_ui*", "plugins*"]

[tool.ruff]
line-length = 120
target-version = "py311"
lint.select = ["E", "F", "I", "W", "UP", "B", "C4", "C90"]
lint.ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-n auto --tb=short"

[tool.coverage.run]
source = ["agent", "damon_cli", "gateway", "tools", "cron", "scripts"]
omit = ["*/tests/*", "*/conftest.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "def __repr__", "raise NotImplementedError", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]
