[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "damon-license"
version = "0.1.0"
description = "Damon Agent License & Subscription System"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Damon Agent Team", email = "team@damon-agent.dev"}]
maintainers = [{name = "Damon Agent Team", email = "team@damon-agent.dev"}]
keywords = ["license", "subscription", "damon-agent", "auth"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.26",
    "python-jose[cryptography]>=3.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "redis>=5.0",
    "stripe>=8.0",
    "python-dateutil>=2.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.8",
    "pre-commit>=3.6",
]
server = [
    "fastapi>=0.109",
    "uvicorn>=0.27",
    "gunicorn>=21.0",
    "slowapi>=0.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["damon_license*"]

[tool.ruff]
line-length = 120
target-version = "py311"
lint.select = ["E", "F", "I", "W", "UP", "B", "C4", "C90"]
lint.ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-n auto --tb=short"