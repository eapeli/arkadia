name: Build macOS Installer

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  authorize:
    name: Authorize (admins only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check actor is a repo admin
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          perm=$(gh api \
            "repos/${{ github.repository }}/collaborators/${ACTOR}/permission" \
            --jq '.permission')
          echo "Actor '${ACTOR}' has permission: ${perm}"
          if [ "${perm}" != "admin" ]; then
            echo "::error::'${ACTOR}' is not a repo admin (permission=${perm}). Refusing to build/sign."
            exit 1
          fi
          echo "Authorized: '${ACTOR}' is an admin."

  build:
    name: Damon-Setup.dmg
    needs: authorize
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 24

      - name: Install npm dependencies
        run: npm install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Cache Rust targets
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          workspaces: apps/bootstrap-installer/src-tauri

      - name: Build installer
        run: npm run tauri:build
        working-directory: apps/bootstrap-installer

      - name: Notarize DMG (Apple Developer ID)
        if: env.APPLE_DEVELOPER_ID != '' && env.APPLE_DEVELOPER_PASSWORD != '' && env.APPLE_TEAM_ID != ''
        uses: apple-actions/notarize@v1
        with:
          app-path: apps/bootstrap-installer/src-tauri/target/release/bundle/dmg/Damon Agent Setup_1.0.0_aarch64.dmg
          apple-id: ${{ secrets.APPLE_ID }}
          apple-id-password: ${{ secrets.APPLE_DEVELOPER_PASSWORD }}
          team-id: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload DMG installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: Damon-Setup-dmg
          path: apps/bootstrap-installer/src-tauri/target/release/bundle/dmg/*.dmg

      - name: Upload App bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: Damon-Setup-app
          path: apps/bootstrap-installer/src-tauri/target/release/bundle/macos/*.app