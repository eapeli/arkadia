name: Damon Core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

jobs:
  lint-and-test:
    name: Lint & Test Core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3.11-venv git

      - name: Install Damon in editable mode
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e .

      - name: Run damon doctor
        run: damon doctor --quiet || true

      - name: Check tool imports
        run: |
          python -c "import damon.tools; from damon.tools import file_tools, terminal_tool, web_tools, read_extract, registry, code_execution_tool, vision_tools, image_generation_tool, tts_tool, send_message_tool, cronjob_tools, memory_tool, skills_tool, todo_tool, delegate_tool, model_tools, toolsets; print('All core tool imports OK')"

      - name: Check CLI commands
        run: |
          damon --version
          damon --help | head -5
          damon doctor --version-check || true

  validate-build:
    name: Validate Package Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --sdist

      - name: Verify package contents
        run: |
          unzip -l dist/*.whl | head -50
          tar -tzf dist/*.tar.gz | head -50

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [lint-and-test, validate-build]
    if: failure()
    steps:
      - name: Print failure summary
        run: echo "::warning::CI pipeline failed - check workflow logs"